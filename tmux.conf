# macos-tmux — invisible tmux with huge scrollback
# Goal: persistent scrollback in any terminal, same colors, normal mouse
# scroll + copy, and no visible sign you're inside tmux.

# ── Scrollback ────────────────────────────────────────────────────────────
# tmux keeps scrollback in RAM per pane, so "infinite" = a very large cap.
# 1,000,000 lines ≈ a few hundred MB per heavy pane. No lag during normal
# use — cost is only memory, paid lazily as lines are produced.
set -g history-limit 1000000

# ── Colors look identical ───────────────────────────────────────────────────
# Advertise a 256-color terminal and pass truecolor (24-bit RGB) straight
# through, so anything inside tmux renders exactly as it would bare.
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Fallback for terminals that only match on the override syntax:
set -ag terminal-overrides ",*:Tc"

# ── Zero latency ──────────────────────────────────────────────────────────
# Default 500ms escape delay makes vim/shells feel laggy inside tmux. Kill it.
set -sg escape-time 0
set -g  focus-events on
setw -g aggressive-resize on

# ── Mouse: scroll + copy like a normal terminal ─────────────────────────────
set -g mouse on

# Wheel scrolls into history; reaching the bottom drops back to the prompt.
bind -T copy-mode    WheelUpPane send -N1 -X scroll-up
bind -T copy-mode    WheelDownPane send -N1 -X scroll-down
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# Drag-select copies to the system clipboard via OSC52 (works locally and over
# SSH — the terminal emulator does the actual clipboard write). Selection stays
# put instead of yanking you back to the bottom.
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
# Tip: hold Shift while dragging to bypass tmux entirely and use the
# terminal's own native selection.

# ── Invisible ───────────────────────────────────────────────────────────────
# No status bar.
set -g status off
# Forward the real title so the terminal tab/window looks unchanged.
set -g set-titles on
set -g set-titles-string "#T"
# No visual bell / activity noise.
set -g visual-bell off
set -g visual-activity off
set -g monitor-activity off
# Start numbering at 1 (only matters if you ever do split — harmless).
set -g renumber-windows on
